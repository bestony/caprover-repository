captainVersion: 4
services:
    $$cap_appname-db:
        image: postgres:$$cap_pg_version
        volumes:
            - $$cap_appname-db-data:/var/lib/postgresql/data
        restart: always
        environment:
            POSTGRES_DB: $$cap_db_name
            POSTGRES_USER: $$cap_db_user
            POSTGRES_PASSWORD: $$cap_db_pass
            PGPASSWORD: $$cap_db_pass
        caproverExtra:
            notExposeAsWebApp: 'true'
    $$cap_appname-gotenberg:
        image: gotenberg/gotenberg:$$cap_gotenberg_version
        restart: always
        caproverExtra:
            notExposeAsWebApp: 'true'
    $$cap_appname:
        image: solidtime/solidtime:$$cap_app_version
        volumes:
            - $$cap_appname-storage:/var/www/html/storage
        restart: always
        depends_on:
            - $$cap_appname-db
            - $$cap_appname-gotenberg
        # Passport keys cannot be generated by CapRover variables. Create them
        # once in the shared storage volume, then hand over to the image entrypoint.
        command:
            - sh
            - -c
            - cd /var/www/html && { [ -f storage/oauth-private.key ] || php artisan passport:keys --force; } && exec start-container
        environment:
            CONTAINER_MODE: http
            AUTO_DB_MIGRATE: 'true'
            APP_NAME: solidtime
            VITE_APP_NAME: solidtime
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: https://$$cap_appname.$$cap_root_domain
            APP_FORCE_HTTPS: 'true'
            TRUSTED_PROXIES: 0.0.0.0/0,2000:0:0:0:0:0:0:0/3
            APP_KEY: $$cap_app_key
            SUPER_ADMINS: $$cap_super_admins
            LOG_CHANNEL: stderr_daily
            LOG_LEVEL: info
            DB_CONNECTION: pgsql
            DB_HOST: $$cap_appname-db
            DB_PORT: '5432'
            DB_SSL_MODE: prefer
            DB_DATABASE: $$cap_db_name
            DB_USERNAME: $$cap_db_user
            DB_PASSWORD: $$cap_db_pass
            MAIL_MAILER: $$cap_mail_mailer
            MAIL_HOST: $$cap_mail_host
            MAIL_PORT: $$cap_mail_port
            MAIL_ENCRYPTION: $$cap_mail_encryption
            MAIL_USERNAME: $$cap_mail_username
            MAIL_PASSWORD: $$cap_mail_password
            MAIL_FROM_ADDRESS: $$cap_mail_from_address
            MAIL_FROM_NAME: solidtime
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            PUBLIC_FILESYSTEM_DISK: public
            GOTENBERG_URL: http://$$cap_appname-gotenberg:3000
        caproverExtra:
            containerHttpPort: '8000'
    $$cap_appname-scheduler:
        volumes:
            - $$cap_appname-storage:/var/www/html/storage
        restart: always
        depends_on:
            - $$cap_appname
        environment:
            CONTAINER_MODE: scheduler
            AUTO_DB_MIGRATE: 'false'
            APP_NAME: solidtime
            VITE_APP_NAME: solidtime
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: https://$$cap_appname.$$cap_root_domain
            APP_FORCE_HTTPS: 'true'
            TRUSTED_PROXIES: 0.0.0.0/0,2000:0:0:0:0:0:0:0/3
            APP_KEY: $$cap_app_key
            SUPER_ADMINS: $$cap_super_admins
            LOG_CHANNEL: stderr_daily
            LOG_LEVEL: info
            DB_CONNECTION: pgsql
            DB_HOST: $$cap_appname-db
            DB_PORT: '5432'
            DB_SSL_MODE: prefer
            DB_DATABASE: $$cap_db_name
            DB_USERNAME: $$cap_db_user
            DB_PASSWORD: $$cap_db_pass
            MAIL_MAILER: $$cap_mail_mailer
            MAIL_HOST: $$cap_mail_host
            MAIL_PORT: $$cap_mail_port
            MAIL_ENCRYPTION: $$cap_mail_encryption
            MAIL_USERNAME: $$cap_mail_username
            MAIL_PASSWORD: $$cap_mail_password
            MAIL_FROM_ADDRESS: $$cap_mail_from_address
            MAIL_FROM_NAME: solidtime
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            PUBLIC_FILESYSTEM_DISK: public
            GOTENBERG_URL: http://$$cap_appname-gotenberg:3000
        caproverExtra:
            # The image HEALTHCHECK probes FrankenPHP on :2019, which only runs in
            # http mode. Disable it so Swarm does not kill worker/scheduler tasks.
            dockerfileLines:
                - FROM solidtime/solidtime:$$cap_app_version
                - HEALTHCHECK NONE
            notExposeAsWebApp: 'true'
    $$cap_appname-queue:
        volumes:
            - $$cap_appname-storage:/var/www/html/storage
        restart: always
        depends_on:
            - $$cap_appname
        environment:
            CONTAINER_MODE: worker
            WORKER_COMMAND: php /var/www/html/artisan queue:work
            AUTO_DB_MIGRATE: 'false'
            APP_NAME: solidtime
            VITE_APP_NAME: solidtime
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: https://$$cap_appname.$$cap_root_domain
            APP_FORCE_HTTPS: 'true'
            TRUSTED_PROXIES: 0.0.0.0/0,2000:0:0:0:0:0:0:0/3
            APP_KEY: $$cap_app_key
            SUPER_ADMINS: $$cap_super_admins
            LOG_CHANNEL: stderr_daily
            LOG_LEVEL: info
            DB_CONNECTION: pgsql
            DB_HOST: $$cap_appname-db
            DB_PORT: '5432'
            DB_SSL_MODE: prefer
            DB_DATABASE: $$cap_db_name
            DB_USERNAME: $$cap_db_user
            DB_PASSWORD: $$cap_db_pass
            MAIL_MAILER: $$cap_mail_mailer
            MAIL_HOST: $$cap_mail_host
            MAIL_PORT: $$cap_mail_port
            MAIL_ENCRYPTION: $$cap_mail_encryption
            MAIL_USERNAME: $$cap_mail_username
            MAIL_PASSWORD: $$cap_mail_password
            MAIL_FROM_ADDRESS: $$cap_mail_from_address
            MAIL_FROM_NAME: solidtime
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            PUBLIC_FILESYSTEM_DISK: public
            GOTENBERG_URL: http://$$cap_appname-gotenberg:3000
        caproverExtra:
            # The image HEALTHCHECK probes FrankenPHP on :2019, which only runs in
            # http mode. Disable it so Swarm does not kill worker/scheduler tasks.
            dockerfileLines:
                - FROM solidtime/solidtime:$$cap_app_version
                - HEALTHCHECK NONE
            notExposeAsWebApp: 'true'
caproverOneClickApp:
    variables:
        - id: $$cap_app_version
          label: solidtime Version
          defaultValue: 0.22.1
          description: Tag from https://hub.docker.com/r/solidtime/solidtime/tags
          validRegex: /^([^\s\/])+$/
        - id: $$cap_pg_version
          label: PostgreSQL Version
          defaultValue: '17'
          description: Tag from https://hub.docker.com/_/postgres/tags. Prefer Debian tags (17, 16, 15); alpine tags fail with "Operation not permitted" on older Docker hosts.
          validRegex: /^([^\s\/])+$/
        - id: $$cap_gotenberg_version
          label: Gotenberg Version
          defaultValue: '8'
          description: Tag from https://hub.docker.com/r/gotenberg/gotenberg/tags (used for PDF reports and invoices)
          validRegex: /^([^\s\/])+$/
        - id: $$cap_db_name
          label: Database Name
          defaultValue: solidtime
          description: PostgreSQL database name
          validRegex: /^[A-Za-z0-9_]+$/
        - id: $$cap_db_user
          label: Database User
          defaultValue: solidtime
          description: PostgreSQL username
          validRegex: /^[A-Za-z0-9_]+$/
        - id: $$cap_db_pass
          label: Database Password
          defaultValue: $$cap_gen_random_hex(24)
          description: PostgreSQL password
          validRegex: /^[^\s'"]{12,}$/
        - id: $$cap_app_key
          label: App Key
          defaultValue: $$cap_gen_random_hex(32)
          description: Laravel APP_KEY. Must be exactly 32 characters. Do not change it after the first deploy.
          validRegex: /^.{32}$/
        - id: $$cap_super_admins
          label: Super Admin Emails
          defaultValue: ''
          description: Optional comma-separated emails that get super admin rights once they register
        - id: $$cap_mail_mailer
          label: Mail Driver
          defaultValue: log
          description: Use smtp to send real emails. log only writes emails to the container log.
          validRegex: /^(smtp|log)$/
        - id: $$cap_mail_host
          label: SMTP Host
          defaultValue: ''
          description: Only used when Mail Driver is smtp
        - id: $$cap_mail_port
          label: SMTP Port
          defaultValue: '587'
          description: Only used when Mail Driver is smtp
          validRegex: /^[0-9]*$/
        - id: $$cap_mail_encryption
          label: SMTP Encryption
          defaultValue: tls
          description: tls, ssl, or leave empty
          validRegex: /^(tls|ssl|)$/
        - id: $$cap_mail_username
          label: SMTP Username
          defaultValue: ''
        - id: $$cap_mail_password
          label: SMTP Password
          defaultValue: ''
        - id: $$cap_mail_from_address
          label: Mail From Address
          defaultValue: no-reply@example.com
          description: Sender address for outgoing mail
          validRegex: /.+@.+/
    instructions:
        start: >-
            solidtime is an open-source time tracker for freelancers and agencies.

            This template deploys the web app, a scheduler, a queue worker,
            PostgreSQL, and Gotenberg (PDF rendering). The web app runs database
            migrations and creates the OAuth (Passport) keys on first boot.

            Save the App Key: changing it later breaks encrypted data and sessions.
        end: >-
            solidtime is deployed.

            1. Enable HTTPS for $$cap_appname (APP_FORCE_HTTPS is on).

            2. Open https://$$cap_appname.$$cap_root_domain and register the first
            account. Emails listed in Super Admin Emails get admin rights.

            First boot can take a minute while migrations run. If the scheduler or
            queue started before the database was ready, restart them once.

            Database (internal): $$cap_appname-db:5432
    displayName: solidtime
    isOfficial: false
    description: Open-source time tracker with PostgreSQL, scheduler, queue worker, and Gotenberg
    documentation: Taken from https://github.com/solidtime-io/self-hosting-examples/tree/main/1-docker-with-database and https://docs.solidtime.io/self-hosting/guides/docker
