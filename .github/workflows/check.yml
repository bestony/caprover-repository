name: Check templates

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: check-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Check template format and catalog merge
              run: npm run check
              env:
                  LOG_LEVEL: info

            - name: Run tests and verify build
              run: npm test
              env:
                  LOG_LEVEL: info
